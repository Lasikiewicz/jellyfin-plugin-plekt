<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Plekt</title>
</head>
<body>
    <div id="PlektConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <h2>Plekt connection</h2>
                <p>Copy the complete webhook address from Plekt under Settings, Media Servers, Webhooks.</p>
                <form id="PlektConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="WebhookUrl">Plekt webhook address</label>
                        <input id="WebhookUrl" name="WebhookUrl" type="url" is="emby-input" placeholder="http://localhost:5056/api/webhook?token=..." required />
                        <div class="fieldDescription">Paste the full address exactly as shown in Plekt. Jellyfin must be able to reach the host in that address.</div>
                    </div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span>Save</span></button>
                </form>
                <p id="PlektStatus" role="status" aria-live="polite"></p>
            </div>
        </div>
        <script>
            const PlektConfig = { pluginUniqueId: 'f80947da-37dc-43e6-9f0d-1c77014b8118' };
            const page = document.querySelector('#PlektConfigPage');
            const form = document.querySelector('#PlektConfigForm');
            const status = document.querySelector('#PlektStatus');

            page.addEventListener('pageshow', () => {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(PlektConfig.pluginUniqueId).then(config => {
                    document.querySelector('#WebhookUrl').value = config.WebhookUrl || '';
                    if (!config.WebhookUrl && config.PlektUrl && config.WebhookSecret) {
                        document.querySelector('#WebhookUrl').value = `${config.PlektUrl.replace(/\/$/, '')}/api/webhook?token=${encodeURIComponent(config.WebhookSecret)}`;
                    }
                }).finally(() => Dashboard.hideLoadingMsg());
            });

            form.addEventListener('submit', event => {
                event.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(PlektConfig.pluginUniqueId).then(config => {
                    config.WebhookUrl = document.querySelector('#WebhookUrl').value.trim();
                    return ApiClient.updatePluginConfiguration(PlektConfig.pluginUniqueId, config);
                }).then(result => {
                    status.textContent = 'Plekt settings saved.';
                    Dashboard.processPluginConfigurationUpdateResult(result);
                }).catch(() => {
                    status.textContent = 'Could not save Plekt settings. Check the Jellyfin server logs.';
                    Dashboard.hideLoadingMsg();
                });
            });
        </script>
    </div>
</body>
</html>
